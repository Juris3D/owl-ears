# Builds OwlEars.exe on GitHub's machines and publishes it as a release - so the binary on the Releases page is built
# from exactly the source in this repository.
# Start it: Actions > release > Run workflow (give the version, e.g. v2.0) - or push a tag v*.
name: release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to create and release (e.g. v2.0)'
        required: true
        default: 'v2.0'
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.event.inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - name: MinGW-w64
        run: sudo apt-get update && sudo apt-get install -y g++-mingw-w64-x86-64 binutils-mingw-w64-x86-64 zip
      - name: Build
        run: ./build.sh
      - name: Package
        run: |
          cp build/OwlEars.exe .
          zip "OwlEars_${VERSION}_win64.zip" OwlEars.exe README.md LICENSE licenses/*
      - name: Release (it creates the tag at this commit when it is new)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$VERSION" OwlEars.exe "OwlEars_${VERSION}_win64.zip" --target "$GITHUB_SHA" \
            --title "Owl Ears ${VERSION#v}" --notes-file .github/release-notes.md
