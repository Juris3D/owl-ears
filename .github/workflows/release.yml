# Builds OwlEars.exe on GitHub's machines and publishes it as a release when a version tag (v*) is pushed.
# The binary on the Releases page is therefore built from exactly the source at that tag.
name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: MinGW-w64
        run: sudo apt-get update && sudo apt-get install -y g++-mingw-w64-x86-64 binutils-mingw-w64-x86-64 zip
      - name: Build
        run: ./build.sh
      - name: Package
        run: |
          cp build/OwlEars.exe .
          zip OwlEars_${GITHUB_REF_NAME}_win64.zip OwlEars.exe README.md LICENSE licenses/*
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" OwlEars.exe "OwlEars_${GITHUB_REF_NAME}_win64.zip" \
            --title "Owl Ears ${GITHUB_REF_NAME#v}" --notes-file .github/release-notes.md
